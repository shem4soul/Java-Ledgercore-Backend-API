name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, unit + integration + concurrency tests
    runs-on: ubuntu-latest        # Docker is available, so Testcontainers can start PostgreSQL 16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify (surefire unit tests, failsafe *IT tests against a real PostgreSQL)
        run: mvn -B verify
      - name: Database-level invariants (migrations, triggers, locking, idempotency)
        run: |
          sudo systemctl start postgresql || true
          sudo -u postgres psql -c "CREATE ROLE ledgercore LOGIN SUPERUSER PASSWORD 'ledgercore'" || true
          pip install --quiet psycopg2-binary
          PGHOST=localhost PGUSER=ledgercore PGPASSWORD=ledgercore python3 scripts/verify_db_invariants.py
          PGHOST=localhost PGUSER=ledgercore PGPASSWORD=ledgercore python3 scripts/verify_sql_statements.py
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          retention-days: 14
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ledgercore-jar
          path: target/ledgercore.jar
          retention-days: 7

  image:
    name: Build image and scan for vulnerabilities
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ledgercore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ledgercore:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test the container (boots, migrates, reports healthy)
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=ledgercore postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker run -d --name app --network smoke -p 8081:8081 \
            -e DB_URL=jdbc:postgresql://pg:5432/ledgercore -e DB_USERNAME=postgres -e DB_PASSWORD=smoke \
            -e JWT_SECRET=ci-smoke-secret-ci-smoke-secret-123456 ledgercore:ci
          for i in $(seq 1 45); do curl -fs http://localhost:8081/actuator/health/readiness && exit 0; sleep 2; done
          docker logs app; exit 1
