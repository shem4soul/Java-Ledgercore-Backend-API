groups:
  - name: ledgercore
    rules:
      - alert: LedgerReconciliationDiscrepancy
        expr: ledgercore_reconciliation_discrepancies > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Ledger does not reconcile"
          description: "Balances and ledger entries disagree. Stop money movement and investigate: POST /api/v1/admin/reconciliation/run."

      - alert: OutboxDeadLetters
        expr: ledgercore_outbox_dead > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Dead-lettered outbox events need attention"
          description: "Review GET /api/v1/admin/outbox?status=DEAD and replay with POST /api/v1/admin/outbox/{id}/retry."

      - alert: OutboxBacklogGrowing
        expr: ledgercore_outbox_backlog > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Outbox backlog is growing"
          description: "Downstream delivery is slower than event production."

      - alert: HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of requests are failing with 5xx"

      - alert: DatabasePoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Connection pool above 90% for 5 minutes"

      - alert: TransferRejectionsSpike
        expr: sum(rate(ledgercore_transfers_rejected_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Unusually many rejected transfers (possible abuse or client bug)"
