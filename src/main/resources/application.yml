spring:
  application:
    name: ledgercore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
    username: ${DB_USERNAME:ledgercore}
    password: ${DB_PASSWORD:ledgercore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none           # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: 8081                  # actuator is on a separate port that is NOT exposed through the load balancer
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ledgercore

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ledgercore:
  jwt:
    secret: ${JWT_SECRET}       # required, minimum 32 characters (no default on purpose: fail fast)
    issuer: ledgercore
    access-ttl: PT15M
    refresh-ttl: P7D
  security:
    cors-origins: ${CORS_ORIGINS:http://localhost:3000}
    auth-requests-per-minute: 20
    max-failed-logins: 5
    lock-duration: PT15M
    bcrypt-strength: 12
  ledger:
    default-daily-limit-minor: 500000000   # 5,000,000.00 in minor units
    max-accounts-per-user: 5
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 8
    base-backoff: PT5S
    max-backoff: PT15M
    lease: PT2M
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  reconciliation:
    cron: "0 0 2 * * *"

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
